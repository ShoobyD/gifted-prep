<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
	<!-- The album's blue cover, full bleed so the maskable crop never shows transparency. -->
	<rect width="512" height="512" fill="#1446a0"/>
	<!-- A gold star sticker (DESIGN.md: upright 3:4, white die-cut edge), a little crooked,
	     kept inside the central circle that every maskable crop keeps. -->
	<g transform="rotate(-6 256 256) translate(143 106) scale(2.26)">
		<!-- Its shadow on the cover. -->
		<rect x="2" y="8" width="96" height="129" rx="12" fill="#05103a" opacity=".35"/>
		<rect x="2" y="2" width="96" height="129" rx="12" fill="#ffffff"/>
		<rect x="8" y="8" width="84" height="96" rx="8" fill="#ffb000"/>
		<path d="M50 30l8 17 19 3-14 13 4 19-17-9-17 9 4-19-14-13 19-3z" fill="#ffffff" stroke="#10224f" stroke-width="4" stroke-linejoin="round"/>
		<path d="M14 117h48" stroke="#c9d1e3" stroke-width="3" stroke-linecap="round"/>
	</g>
</svg>
